<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Matching Game</title>

<style>

body{
    margin:0;
    font-family:'Comic Sans MS', cursive;
    background:linear-gradient(135deg,#fff7b2,#caffbf,#ffd6a5);
    min-height:100vh;
    text-align:center;
}

nav{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    padding:10px;
}

nav a{
    text-decoration:none;
    color:white;
    background:#90be6d;
    padding:10px 18px;
    border-radius:20px;
}

h1{
    padding:2px;
    color:#ff6b00;
    font-size:45px;
}

.score{
    font-size:28px;
    margin-bottom:20px;
    color:#333;
}

.game-board{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
    transform-style:preserve-3d;
}

.card:hover{
    transform:translateY(-10px) rotateX(10deg);
}

.card img{
    width:100px;
    height:100px;
    object-fit:contain;
}

.correct{
    animation:pop 0.5s;
    background:#b7ffb7;
}

.wrong{
    animation:shake 0.5s;
    background:#ffb3b3;
}

.hidden{
    display:none;
}

@keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-10px);}
    75%{transform:translateX(10px);}
}

@keyframes pop{
    0%{transform:scale(0.8);}
    100%{transform:scale(1);}
}

button{
    margin:30px;
    padding:15px 30px;
    border:none;
    border-radius:20px;
    background:#ff9f1c;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-family:'Comic Sans MS', cursive;
}

.message{
    font-size:30px;
    color:#ff6b00;
    min-height:40px;
}

</style>
</head>

<body>

<h1>🍔 Food Matching Game 🍔</h1>

<nav>
<a href="index.html">Home</a>
<a href="vocabulary.html">Vocabulary</a>
<a href="healthy.html">Healthy Food</a>
<a href="safety.html">Internet Safety</a>
</nav>

<div class="score">
Score: <span id="score">0</span>
</div>

<div class="message" id="message"></div>

<div class="game-board" id="board"></div>

<button onclick="startGame()">Reset Game</button>

<script>

const foods = [
"Onions","Lettuce","Chocolate","Biscuit",
"Sugar","Flour","Omelette","Peas",
"Pancake","Pineapple","Peppers","Coconut"
];

const images = [
"https://img.magnific.com/premium-photo/fresh-red-onion-isolated-white-background_454083-21.jpg",
"https://static.vecteezy.com/system/resources/previews/004/288/070/large_2x/salad-leaf-lettuce-isolated-on-white-background-photo.jpg",
"https://t3.ftcdn.net/jpg/05/07/81/42/360_F_507814277_YH3Vgm7BLrAtD7Bv2MPTG1aKVe5QZl14.jpg",
"https://img.magnific.com/premium-photo/assorted-biscuits-with-white-background_631068-1500.jpg",
"https://png.pngtree.com/png-clipart/20250105/original/pngtree-white-sugar-crystals-and-cubes-on-a-plain-background-perfect-for-png-image_18753423.png",
"https://img.magnific.com/premium-photo/wheat-flour-wheat-bars-white-background_320146-63.jpg",
"https://media.istockphoto.com/id/1372112175/photo/omelet-frittata-homemade-omelet-isolated-on-dish-with-white-background.jpg?s=612x612&w=0&k=20&c=e6F08MErFbCxB7dAQbVvNGUlRdOYLLuaoVFtHl09R0I=",
"https://img.magnific.com/premium-photo/fresh-green-peas-with-pods-isolated-white-background_252965-770.jpg",
"https://static.vecteezy.com/system/resources/previews/030/659/718/large_2x/pancakes-with-white-background-high-quality-ultra-free-photo.jpg",
"https://media.istockphoto.com/id/1217479737/photo/pineapple-with-slices-isolated-on-white-background.jpg?s=612x612&w=0&k=20&c=KYxsZ-Bv1tEgjrOmH9qxak06iTK9S5betgteqTuDzhU=",
"https://img.magnific.com/premium-photo/bell-peppers-isolated-white-background_198067-11.jpg",
"https://img.magnific.com/premium-photo/coconut-isolated-white-background_252965-356.jpg"
];

let score = 0;
let selected = null;
let matched = 0;
let lockBoard = false;

function shuffle(array){
    return array.sort(()=>Math.random()-0.5);
}

function startGame(){

document.getElementById("board").innerHTML="";
document.getElementById("message").innerHTML="";

score = 0;
matched = 0;
selected = null;
lockBoard = false;

updateScore();

let cards=[];

foods.forEach((food,index)=>{

    cards.push({
        type:"word",
        value:food,
        match:index
    });

    cards.push({
        type:"image",
        value:images[index],
        match:index
    });

});

shuffle(cards);

cards.forEach(card=>{

    const div=document.createElement("div");
    div.className="card";

    if(card.type==="word"){
        div.innerHTML=`<h2>${card.value}</h2>`;
    }else{
        div.innerHTML=`<img src="${card.value}">`;
    }

    div.onclick=()=>selectCard(div,card);

    document.getElementById("board").appendChild(div);

});

}

function selectCard(div,card){

if(lockBoard) return;

if(div.classList.contains("hidden")) return;

if(selected === null){

    selected = {div,card};

    div.style.background="#ffe066";

}else{

    if(selected.div === div){
        return;
    }

    lockBoard = true;

    if(
        selected.card.match === card.match &&
        selected.card.type !== card.type
    ){

        div.classList.add("correct");
        selected.div.classList.add("correct");

        score += 10;
        matched++;

        updateScore();

        document.getElementById("message").innerHTML =
        "🎉 Correct Match!";

        setTimeout(()=>{

            div.classList.add("hidden");
            selected.div.classList.add("hidden");

            if(matched === foods.length){

                document.getElementById("message").innerHTML =
                "🎊 Congratulations! You matched all foods! 🎊";

            }

            selected = null;
            lockBoard = false;

        },700);

    }else{

        div.classList.add("wrong");
        selected.div.classList.add("wrong");

        score -= 5;

        updateScore();

        document.getElementById("message").innerHTML =
        "😢 Wrong Match!";

        setTimeout(()=>{

            div.classList.remove("wrong");
            selected.div.classList.remove("wrong");

            div.style.background="white";
            selected.div.style.background="white";

            selected = null;
            lockBoard = false;

        },700);

    }

}

}

function updateScore(){
    document.getElementById("score").innerHTML = score;
}

startGame();

</script>

</body>
</html>
